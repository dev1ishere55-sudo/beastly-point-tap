<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chicken Beast</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0f;--card:#1a1a1e;--gold:#f5c518;--orange:#ff8c00;--yellow:#ffd700;--green:#39ff14;--text:#e8e8e8;--muted:#8a8a90;--border:#2c2c32}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:70px;overflow-x:hidden}
.pixel{font-family:'Press Start 2P',monospace;font-size:10px;letter-spacing:0.5px}
.hidden{display:none!important}
#landing{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.brand{font-family:'Press Start 2P',monospace;font-size:28px;color:var(--gold);margin-bottom:12px;line-height:1.3}
.tag{color:var(--muted);margin:16px 0 28px;font-size:14px;max-width:300px}
input,button{font-family:inherit}
.signup{width:100%;max-width:280px}
.signup input{width:100%;padding:14px;background:var(--card);border:2px solid var(--border);color:var(--text);border-radius:8px;margin-bottom:12px;font-size:16px}
.cta{width:100%;padding:14px;background:var(--orange);color:#111;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:15px}
.cta:active{transform:scale(.97)}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#111;border-bottom:1px solid var(--border)}
.header-left{display:flex;align-items:center;gap:10px}
.chicken-icon{font-size:28px}
.lv-badge{background:var(--card);border:1px solid var(--border);padding:4px 8px;border-radius:6px;font-size:11px;font-weight:700}
.grain{display:flex;align-items:center;gap:6px;background:var(--card);padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600}
#app{max-width:420px;margin:0 auto}
.view{padding:16px}
.chicken-stage{background:var(--card);border:2px solid var(--border);border-radius:12px;padding:20px;text-align:center;margin-bottom:16px}
.sprite{font-size:72px;margin:8px 0}
.level-row{display:flex;justify-content:space-between;font-size:12px;margin:8px 0 4px;color:var(--muted)}
.bar{height:10px;background:#222;border-radius:5px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd700,#ff8c00)}
.energy-bar i{background:linear-gradient(90deg,#39ff14,#00cc66)}
.tap-btn{width:100%;padding:16px;background:var(--orange);color:#111;border:none;border-radius:10px;font-weight:800;font-size:16px;cursor:pointer;margin:10px 0}
.tap-btn:active{transform:scale(.96)}
.daily-btn{width:100%;padding:14px;background:var(--yellow);color:#111;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.mission{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
.mission h4{font-size:14px;margin-bottom:4px}
.mission .progress{font-size:12px;color:var(--muted)}
.upgrade{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px}
.upgrade .info{flex:1}
.upgrade button{background:var(--yellow);color:#111;border:none;padding:8px 12px;border-radius:6px;font-weight:700;cursor:pointer}
.upgrade button:disabled{background:#333;color:#666}
.dock{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 0 env(safe-area-inset-bottom);z-index:50}
.dock button{background:none;border:none;color:var(--muted);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 8px}
.dock button.active{color:var(--gold)}
.dock .icon{font-size:20px}
.streak-row{display:flex;gap:6px;justify-content:center;margin:10px 0}
.streak-box{width:32px;height:32px;border:1px solid var(--border);border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700}
.streak-box.done{background:var(--gold);color:#111}
canvas#gymCanvas{display:none}
</style>
</head>
<body>
<div id="landing">
  <div class="brand">CHICKEN<br>BEAST</div>
  <p class="tag">Tap to train. No wallet. Just open in Telegram.</p>
  <div class="signup">
    <input id="nameInput" placeholder="Your name" maxlength="20">
    <button class="cta" onclick="signup()">Enter</button>
  </div>
</div>
<div id="app" class="hidden">
  <div class="header">
    <div class="header-left">
      <span class="chicken-icon" id="headerEmoji">🐣</span>
      <div>
        <div class="pixel" style="font-size:9px;color:var(--gold)">CHICKE BEAST</div>
        <div class="lv-badge" id="headerLv">LV 1</div>
      </div>
    </div>
    <div class="grain">🥚 <span id="grainDisplay">0</span></div>
  </div>
  <div id="view-home" class="view">
    <div class="chicken-stage">
      <div class="pixel" style="color:var(--orange);margin-bottom:8px" id="formLabel">HATCHLING</div>
      <div class="sprite" id="chickenSprite">🐣</div>
      <div class="level-row"><span id="levelText">LEVEL 1</span><span id="xpText">0 / 20 XP</span></div>
      <div class="bar"><i id="xpBar" style="width:0%"></i></div>
      <div class="level-row"><span>⚡ ENERGY</span><span id="energyText">100/100</span></div>
      <div class="bar energy-bar"><i id="energyBar" style="width:100%"></i></div>
    </div>
    <button class="tap-btn" onclick="tap()">TAP TO TRAIN</button>
    <button class="daily-btn" id="dailyBtn" onclick="claimDaily()">CLAIM DAILY REWARD</button>
    <div style="margin-top:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span class="pixel">Daily streak</span>
        <span id="streakLabel">0 DAY</span>
      </div>
      <div class="streak-row" id="streakDays"></div>
    </div>
  </div>
  <div id="view-train" class="view hidden">
    <div class="chicken-stage">
      <div class="sprite" id="trainSprite">🐣</div>
      <div class="pixel">TAP THE CHICKEN</div>
    </div>
    <div style="display:flex;gap:8px;margin:12px 0">
      <div style="flex:1;background:var(--card);padding:10px;border-radius:8px;text-align:center"><div id="todayTaps">0</div><div class="pixel" style="font-size:8px">TODAY</div></div>
      <div style="flex:1;background:var(--card);padding:10px;border-radius:8px;text-align:center"><div id="totalTaps">0</div><div class="pixel" style="font-size:8px">TOTAL</div></div>
      <div style="flex:1;background:var(--card);padding:10px;border-radius:8px;text-align:center"><div id="grainCount">0</div><div class="pixel" style="font-size:8px">GRAIN</div></div>
    </div>
    <div class="pixel" style="margin:12px 0 8px">Upgrades</div>
    <div id="upgrades"></div>
  </div>
  <div id="view-missions" class="view hidden">
    <div class="pixel" style="margin-bottom:12px">Missions</div>
    <div id="missions"></div>
  </div>
  <div id="view-leader" class="view hidden">
    <div class="pixel" style="margin-bottom:12px">Leaderboard</div>
    <div id="lb" style="font-size:13px;color:var(--muted)">Local only. Cloud coming.</div>
  </div>
  <div id="view-profile" class="view hidden">
    <div class="chicken-stage">
      <div class="sprite" id="profileSprite">🐣</div>
      <div class="pixel" id="profileRank">Scrawny Chick</div>
      <div style="font-size:13px;margin:6px 0" id="profileBP">0 BP</div>
    </div>
    <button class="daily-btn" onclick="shareGymCard()">Share Gym Card</button>
    <canvas id="gymCanvas" width="600" height="350"></canvas>
    <div style="margin-top:16px">
      <div class="pixel">Squad</div>
      <input id="squadInput" placeholder="Squad name" style="width:100%;padding:10px;margin:8px 0;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px">
      <button class="cta" onclick="joinSquad()">Join / Create</button>
      <div id="squadInfo" style="font-size:12px;color:var(--muted);margin-top:8px"></div>
    </div>
  </div>
</div>
<div class="dock">
  <button class="active" data-v="home" onclick="switchView('home')"><span class="icon">🏠</span>HOME</button>
  <button data-v="train" onclick="switchView('train')"><span class="icon">⚡</span>TRAIN</button>
  <button data-v="missions" onclick="switchView('missions')"><span class="icon">⭐</span>MISSIONS</button>
  <button data-v="leader" onclick="switchView('leader')"><span class="icon">🏆</span>LEADER</button>
  <button data-v="profile" onclick="switchView('profile')"><span class="icon">👤</span>PROFILE</button>
</div>
<script>
const TIERS = [
  {name:'Hatchling',min:0,emoji:'🐣',color:'#8E8E93'},
  {name:'Feathered Gym Bro',min:500,emoji:'🐥',color:'#30D158'},
  {name:'Alpha',min:5000,emoji:'🐔',color:'#0A84FF'},
  {name:'Giga-Rooster',min:25000,emoji:'🐓',color:'#BF5AF2'},
  {name:'APEX BEAST',min:100000,emoji:'🦖',color:'#CCFF00'}
];
function getTier(bp){let t=TIERS[0];for(const x of TIERS)if(bp>=x.min)t=x;return t;}
let state={xp:0,level:1,energy:100,maxEnergy:100,lastEnergy:Date.now(),grain:0,totalTaps:0,todayTaps:0,lastDay:new Date().toDateString(),streak:0,lastClaim:0,bp:0,name:'',squad:'',upgrades:{pecks:0,lungs:0,digest:0}};
function load(){try{const s=localStorage.getItem('cb_v2');if(s)Object.assign(state,JSON.parse(s));}catch{}}
function save(){localStorage.setItem('cb_v2',JSON.stringify(state));}
load();
function today(){return new Date().toDateString();}
if(state.lastDay!==today()){state.todayTaps=0;state.lastDay=today();save();}
function energyNow(){const regen=Math.floor((Date.now()-state.lastEnergy)/3000);return Math.min(state.maxEnergy,state.energy+regen);}
function xpNeeded(l){return Math.floor(20*Math.pow(1.3,l-1));}
function signup(){
  let name=document.getElementById('nameInput').value.trim();
  try{const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();const u=tg.initDataUnsafe?.user;if(u)name=u.first_name||u.username||name;}}catch{}
  if(!name){alert('Enter a name');return;}
  state.name=name;save();enter();
}
function enter(){
  document.getElementById('landing').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  setInterval(()=>{state.energy=energyNow();state.lastEnergy=Date.now();render();},1000);
  render();
}
function tap(){
  if(energyNow()<1)return;
  try{window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('medium');}catch{}
  state.energy=energyNow()-1;state.lastEnergy=Date.now();
  const gain=1+state.upgrades.pecks;
  state.xp+=gain;state.bp+=gain;state.grain+=1;state.totalTaps++;state.todayTaps++;
  while(state.xp>=xpNeeded(state.level)){state.xp-=xpNeeded(state.level);state.level++;}
  save();render();
}
function claimDaily(){
  const now=Date.now();const day=86400000;
  if(now-state.lastClaim<day)return;
  if(now-state.lastClaim>2*day)state.streak=0;
  state.streak=(state.streak%7)+1;
  state.grain+=10+state.streak*2;state.xp+=25;state.lastClaim=now;
  save();render();
}
function joinSquad(){
  const n=document.getElementById('squadInput').value.trim();
  if(!n)return;
  state.squad=n;save();render();
}
function switchView(v){
  ['home','train','missions','leader','profile'].forEach(x=>{
    document.getElementById('view-'+x).classList.toggle('hidden',x!==v);
    document.querySelector(`[data-v="${x}"]`).classList.toggle('active',x===v);
  });
  render();
}
function generateCard(canvas){
  const ctx=canvas.getContext('2d');const w=600,h=350;canvas.width=w;canvas.height=h;
  const bg=ctx.createLinearGradient(0,0,w,h);bg.addColorStop(0,'#0F120A');bg.addColorStop(1,'#050703');
  ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='#CCFF00';ctx.lineWidth=3;ctx.strokeRect(10,10,w-20,h-20);
  ctx.fillStyle='#CCFF00';ctx.font='900 22px system-ui';ctx.fillText('CHICKEN BEAST',35,48);
  const t=getTier(state.bp);
  ctx.font='40px serif';ctx.textAlign='center';ctx.fillText(t.emoji,85,160);
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 24px system-ui';ctx.fillText(state.name||'Beast',150,145);
  ctx.fillStyle=t.color;ctx.font='bold 14px monospace';ctx.fillText(t.name.toUpperCase(),150,170);
  ctx.fillStyle='#aaa';ctx.font='12px monospace';ctx.fillText('BP: '+state.bp.toLocaleString()+'  Streak: '+state.streak+'  Squad: '+(state.squad||'SOLO'),35,280);
  ctx.fillText('t.me/chickenbeastbot',35,320);
}
function shareGymCard(){
  const canvas=document.getElementById('gymCanvas');
  generateCard(canvas);
  canvas.toBlob(async blob=>{
    if(!blob)return;
    const file=new File([blob],'chicken-beast-card.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],text:'Just trained my Chicken Beast! t.me/chickenbeastbot'});return;}catch{}
    }
    const a=document.createElement('a');a.download='chicken-beast-card.png';a.href=canvas.toDataURL();a.click();
  });
}
function render(){
  const t=getTier(state.bp);
  document.getElementById('headerEmoji').textContent=t.emoji;
  document.getElementById('headerLv').textContent='LV '+state.level;
  document.getElementById('grainDisplay').textContent=state.grain;
  document.getElementById('chickenSprite').textContent=t.emoji;
  document.getElementById('trainSprite').textContent=t.emoji;
  document.getElementById('profileSprite').textContent=t.emoji;
  document.getElementById('formLabel').textContent=t.name.toUpperCase();
  document.getElementById('levelText').textContent='LEVEL '+state.level;
  document.getElementById('xpText').textContent=state.xp+' / '+xpNeeded(state.level)+' XP';
  document.getElementById('xpBar').style.width=(state.xp/xpNeeded(state.level)*100)+'%';
  const e=energyNow();
  document.getElementById('energyText').textContent=Math.floor(e)+'/'+state.maxEnergy;
  document.getElementById('energyBar').style.width=(e/state.maxEnergy*100)+'%';
  document.getElementById('todayTaps').textContent=state.todayTaps;
  document.getElementById('totalTaps').textContent=state.totalTaps;
  document.getElementById('grainCount').textContent=state.grain;
  document.getElementById('profileRank').textContent=t.name;
  document.getElementById('profileBP').textContent=state.bp.toLocaleString()+' BP';
  document.getElementById('streakLabel').textContent=state.streak+' DAY';
  const days=document.getElementById('streakDays');
  days.innerHTML=[1,2,3,4,5,6,7].map(d=>`<div class="streak-box ${d<=state.streak?'done':''}">${d}</div>`).join('');
  const claimed=Date.now()-state.lastClaim<86400000;
  document.getElementById('dailyBtn').textContent=claimed?'CLAIMED':'CLAIM DAILY REWARD';
  document.getElementById('dailyBtn').disabled=claimed;
  document.getElementById('squadInfo').textContent=state.squad?'In squad: '+state.squad:'Not in a squad';
  document.getElementById('upgrades').innerHTML=[
    {k:'pecks',name:'Iron Pecks',desc:'+1 XP/tap',cost:15+state.upgrades.pecks*10},
    {k:'lungs',name:'Big Lungs',desc:'+20 max energy',cost:20+state.upgrades.lungs*12},
    {k:'digest',name:'Fast Digest',desc:'Faster regen',cost:25+state.upgrades.digest*15}
  ].map(u=>`<div class="upgrade"><div class="info"><div>${u.name} LV ${state.upgrades[u.k]}</div><div style="font-size:12px;color:var(--muted)">${u.desc}</div></div><button ${state.grain<u.cost?'disabled':''} onclick="buy('${u.k}',${u.cost})">${u.cost} 🥚</button></div>`).join('');
  document.getElementById('missions').innerHTML=[
    {name:'Morning Reps',prog:state.todayTaps,goal:50,reward:'40 XP'},
    {name:'Gear Up',prog:state.upgrades.pecks+state.upgrades.lungs+state.upgrades.digest,goal:1,reward:'10 Grain'},
    {name:'Show Up',prog:claimed?1:0,goal:1,reward:'20 XP'}
  ].map(m=>`<div class="mission"><h4>${m.name}</h4><div class="progress">${Math.min(m.prog,m.goal)}/${m.goal} · ${m.reward}</div><div class="bar"><i style="width:${Math.min(100,m.prog/m.goal*100)}%"></i></div></div>`).join('');
}
function buy(k,cost){
  if(state.grain<cost)return;
  state.grain-=cost;state.upgrades[k]++;
  if(k==='lungs')state.maxEnergy+=20;
  save();render();
}
if(state.name)enter();else{
  try{const tg=window.Telegram?.WebApp;if(tg&&tg.initDataUnsafe?.user)document.getElementById('nameInput').value=tg.initDataUnsafe.user.first_name||'';}catch{}
}
</script>
</body>
</html>
